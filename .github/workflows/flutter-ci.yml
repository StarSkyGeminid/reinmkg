name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'

      - name: Flutter pub get
        run: flutter pub get

      - name: Create .env from secret
        run: |
          if [ -n "${{ secrets.BMKG_API_TOKEN }}" ]; then
            echo "BMKG_API_TOKEN=${{ secrets.BMKG_API_TOKEN }}" > .env
          else
            echo "BMKG_API_TOKEN=" > .env
          fi

      - name: Analyze
        run: flutter analyze

      - name: Build APK (release)
        run: flutter build apk --release
